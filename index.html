<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yashika Hudda - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const isGitHubPages = window.location.hostname.endsWith("github.io");

      if (isGitHubPages) {
        const styles = document.createElement("link");
        styles.rel = "stylesheet";
        styles.href = "/portfolio/docs/assets/index.css";
        document.head.appendChild(styles);

        const script = document.createElement("script");
        script.type = "module";
        script.src = "/portfolio/docs/assets/index.js";
        document.body.appendChild(script);
      } else {
        const script = document.createElement("script");
        script.type = "module";
        script.src = "/src/main.jsx";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
